# Render Blueprint: Full-stack deployment (Backend serves Frontend)
services:
  - type: web
    name: roomie-fullstack
    runtime: node
    plan: free
    region: singapore
    buildCommand: |
      cd roomie-backend && npm install
      cd ../roomie-prototype && npm install && npx vite build
    startCommand: cd roomie-backend && npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: FRONTEND_URL
        value: https://roomie-fullstack.onrender.com
      - key: GCASH_NUMBER
        sync: false
      - key: GCASH_ACCOUNT_NAME
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
